<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUP Chika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="icon-placeholder"></span>
            <h2>PUP Chika</h2>
        </div>
        <div class="nav-links">
            <button class="nav-btn" onclick="showSection('home-section')">Home</button>
            <button class="nav-btn" onclick="showSection('login-section')">Login / Register</button>
        </div>
    </nav>

    <!-- Home / Feed Section -->
    <section id="home-section" class="view-section">
        <div class="welcome-container">
            <h1>Welcome to PUP Chika</h1>
            <p>Your campus digital tambayan. Connect, share, and stay updated!</p>
        </div>

        <!-- Create Post Card -->
        <div class="card post-create-card">
            <h3>Create a Chika</h3>
            <textarea id="post-input" placeholder="Share something with your fellow Iskolar..." rows="3"></textarea>
            <div class="post-actions">
                <button class="primary-btn" onclick="handleCreatePost()">Post</button>
            </div>
        </div>

        <!-- Dynamic Feed Container -->
        <div id="feed-container">
            <!-- Posts render here via JS -->
        </div>
    </section>

    <!-- Login Section -->
    <section id="login-section" class="view-section" style="display: none;">
        <div class="form-card">
            <h2>Sign In</h2>
            <p>Welcome back! Please enter your account details.</p>
            <div class="input-group">
                <input type="text" id="login-name" placeholder="Account Name" required>
                <input type="text" id="login-student-no" placeholder="Student Number" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button class="primary-btn" onclick="handleLogin()">Login</button>
            </div>
            <hr>
            <div class="register-prompt">
                <span>Don't have an account?</span>
                <button class="text-btn" onclick="toggleModal(true)">Register here</button>
            </div>
        </div>
    </section>

    <!-- Dashboard Section (Logged In) -->
    <section id="dashboard-section" class="view-section" style="display: none;">
        <div class="dashboard-header card">
            <h1>Dashboard</h1>
            <p>Welcome to your personal account hub.</p>
            <button class="secondary-btn" onclick="location.reload()">Logout</button>
        </div>
    </section>

    <!-- Registration Pop-up Modal -->
    <div id="reg-modal" class="modal" style="display: none;">
        <div class="modal-content form-card">
            <span class="close-btn" onclick="toggleModal(false)">&times;</span>
            <h2>Create an Account</h2>
            <div class="input-group">
                <input type="text" id="reg-name" placeholder="Account Name" required>
                <input type="text" id="reg-student-no" placeholder="Student Number" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button class="primary-btn" onclick="handleRegister()">Submit Registration</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
