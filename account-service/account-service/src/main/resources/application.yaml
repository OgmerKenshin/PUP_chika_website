spring:
  datasource:
    # Creates an in-memory database named 'authdb'. DB_CLOSE_DELAY=-1 keeps the
    # DB alive while the JVM runs even if the pool closes all connections.
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      # Allows you to access the DB at http://localhost:8080/h2-console
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # Disable Open-Session-In-View: keep persistence contexts scoped to each
    # @Transactional service call so reads always see the latest committed state.
    open-in-view: false
    hibernate:
      # Automatically creates tables from your Java code
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Important for accessing the H2 console once Spring Security is active
  # We will need to permit access to these frames in your SecurityConfig later.
  application:
    name: account-service
